<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prospector</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/addons/"
        }
      }
    </script>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main id="globe" class="globe"></main>

    <aside class="panel">
      <section class="panel__search">
        <button type="button" id="search-button" class="panel__button">
          Find areas
        </button>
        <p id="search-status" class="panel__status" aria-live="polite"></p>
      </section>
      <section id="resources-category" class="panel__category">
        <h2 class="panel__heading">Resources</h2>
        <div id="resource-options" class="panel__options"></div>
        <button type="button" id="clear-resources" class="panel__clear">Clear all</button>
      </section>
      <p id="error" class="panel__error" role="alert" hidden></p>
    </aside>

    <aside class="panel panel--terrain">
      <h2 class="panel__heading panel__heading--centred">Terrain</h2>
      <section id="terrain-category" class="panel__category">
        <div class="panel__row">
          <div class="panel__item">
            <div class="panel__option">
              <input type="checkbox" id="flat-toggle" />
              <label for="flat-toggle">Flat areas only</label>
            </div>
            <div id="flat-legend" class="legend"></div>
          </div>
          <div class="panel__item">
            <div class="panel__option">
              <input type="checkbox" id="slope-dots-toggle" />
              <label for="slope-dots-toggle">Slope (dots)</label>
            </div>
            <div id="slope-dots-legend" class="legend"></div>
          </div>
        </div>
      </section>
    </aside>

    <aside id="search-results" class="results" hidden>
      <h2 class="results__title">Suitable areas <br>(lower rank is better)</h2>
      <div id="search-result-cards" class="results__cards"></div>
    </aside>
  </body>
</html>

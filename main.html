<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prospector</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/addons/"
        }
      }
    </script>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main id="globe" class="globe"></main>

    <aside class="panel">
      <details id="resources-category" class="panel__category">
        <summary>Resources</summary>
        <div class="panel__options">
          <div class="panel__option">
            <input type="checkbox" id="iron-toggle" />
            <label for="iron-toggle">Iron (FeO)</label>
          </div>
          <div class="panel__option">
            <input type="checkbox" id="silicon-toggle" />
            <label for="silicon-toggle">Silicon (SiO₂)</label>
          </div>
        </div>
      </details>
      <details id="terrain-category" class="panel__category">
        <summary>Terrain</summary>
        <div class="panel__options">
          <div class="panel__option">
            <input type="checkbox" id="flat-toggle" />
            <label for="flat-toggle">Flat areas only</label>
          </div>
          <div class="panel__option">
            <input type="checkbox" id="slope-dots-toggle" />
            <label for="slope-dots-toggle">Slope (dots)</label>
          </div>
        </div>
      </details>
      <section class="panel__search">
        <button type="button" id="search-button" class="panel__button">
          Find areas
        </button>
        <p id="search-status" class="panel__status" aria-live="polite"></p>
      </section>
      <p id="error" class="panel__error" role="alert" hidden></p>
    </aside>

    <aside id="search-results" class="results" hidden>
      <h2 class="results__title">Suitable areas <br>(lower rank is better)</h2>
      <div id="search-result-cards" class="results__cards"></div>
    </aside>
  </body>
</html>

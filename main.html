<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prospector</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/addons/"
        }
      }
    </script>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main id="globe" class="globe"></main>

    <aside class="panel">
      <fieldset class="panel__layers">
        <legend>Layers</legend>
        <div class="panel__option">
          <input type="checkbox" id="iron-toggle" checked />
          <label for="iron-toggle">Iron (FeO)</label>
        </div>
      </fieldset>
      <p id="error" class="panel__error" role="alert" hidden></p>
    </aside>
  </body>
</html>

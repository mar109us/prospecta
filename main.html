<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prospector</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/addons/"
        }
      }
    </script>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main id="globe" class="globe"></main>

    <aside class="panel">
      <details class="panel__category" open>
        <summary>Resources</summary>
        <div class="panel__options">
          <div class="panel__option">
            <input type="checkbox" id="iron-toggle" checked />
            <label for="iron-toggle">Iron (FeO)</label>
          </div>
          <div class="panel__option">
            <input type="checkbox" id="silicon-toggle" checked />
            <label for="silicon-toggle">Silicon (SiO₂)</label>
          </div>
        </div>
      </details>
      <details class="panel__category">
        <summary>Terrain</summary>
        <div class="panel__options">
          <div class="panel__option">
            <input type="checkbox" id="slope-toggle" />
            <label for="slope-toggle">Slope (degrees)</label>
          </div>
        </div>
      </details>
      <p id="error" class="panel__error" role="alert" hidden></p>
    </aside>
  </body>
</html>
